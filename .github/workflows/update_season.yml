name: Auto DeepSeek Season Sync

on:
  schedule:
    - cron: '30 14 * * 4' # Каждый четверг в 14:30 UTC
  workflow_dispatch:      # Кнопка ручного запуска на сайте GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run DeepSeek Updater Script
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python updater.py

      - name: Commit and push playlist.json
        run: |
          git config --global user.name "DeepSeek Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add playlist.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update playlist via DeepSeek AI" && git push)
