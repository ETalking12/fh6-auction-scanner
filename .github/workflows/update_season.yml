name: Обновление Сезона ИИ

on:
  schedule:
    # Запуск каждый четверг в 14:35 UTC (17:35 МСК)
    - cron: '35 14 * * 4'
  workflow_dispatch: # Позволяет запускать скрипт вручную по кнопке

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка зависимостей
        run: pip install requests

      - name: Запуск скрипта обновления ИИ
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python season_updater.py

      - name: Коммит и пуш изменений
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add playlist.json
          git commit -m "🤖 Автоматическое обновление сезона (Serper + DeepSeek)" || echo "Нет изменений для коммита"
          git push
