name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Create Self-Learning Flutter app
        run: |
          # Создаем базовый проект
          flutter create --org com.fh6.scanner --platforms android app_build
          cd app_build

          # Добавляем все необходимые зависимости, включая память и OCR
          flutter pub add camera:0.10.5+9 flutter_tesseract_ocr shared_preferences:2.2.2

          # Копируем ваш main.dart из репозитория
          if [ -f "../lib/main.dart" ]; then
            cp ../lib/main.dart lib/main.dart
          fi

          # Выставляем корректный minSdkVersion для совместимости
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true

          # Добавляем разрешения на камеру и вибрацию
          sed -i '/<application/i <uses-permission android:name="android.permission.CAMERA"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i <uses-permission android:name="android.permission.VIBRATE"/>' android/app/src/main/AndroidManifest.xml

          # Собираем релизный APK без сжатия R8
          flutter build apk --release --no-shrink

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FH6-Auction-SelfLearning-APK
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
