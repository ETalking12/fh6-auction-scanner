name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Create complete Flutter app
        run: |
          # Создаем чистый проект со всеми конфигами
          flutter create --org com.fh6.scanner --platforms android app_build
          cd app_build

          # Добавляем зависимости с совместимыми версиями
          flutter pub add camera:0.10.5+9 google_mlkit_text_recognition:0.13.0

          # Копируем ваш main.dart из репозитория
          if [ -f "../lib/main.dart" ]; then
            cp ../lib/main.dart lib/main.dart
          fi

          # Выставляем минимальную версию Android SDK 21 (требование ML Kit)
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true

          # Добавляем разрешение на камеру
          sed -i '/<application/i <uses-permission android:name="android.permission.CAMERA"/>' android/app/src/main/AndroidManifest.xml

          # Собираем релизный APK
          flutter build apk --release --no-shrink

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FH6-Auction-Scanner-APK
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
